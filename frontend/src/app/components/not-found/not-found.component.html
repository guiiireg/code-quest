<main class="error-container">
  <article class="error-card">
    <header class="card-bg-gradient"></header>

    <figure class="error-glitch-icon">
      <mat-icon>report_problem</mat-icon>
    </figure>

    <hgroup class="error-heading">
      <h1>404</h1>
      <h2>Chemin Introuvable</h2>
    </hgroup>

    <p class="error-text">
      Le serveur de CodeQuest n'a trouvé aucune donnée correspondant à cette URL. 
      La séquence réseau a été interrompue ou l'accès a expiré.
    </p>

    <footer class="error-actions">
      <a mat-flat-button class="action-button" routerLink="/worlds">
        <mat-icon>home</mat-icon>
        <span>Retourner au Dashboard</span>
      </a>
    </footer>
  </article>
</main>
