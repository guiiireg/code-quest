<main class="error-container">
  <article class="error-card">
    <figure class="error-badge">
      <mat-icon>explore_off</mat-icon>
    </figure>

    <hgroup class="error-heading">
      <h1>404</h1>
      <h2>Terres Inexplorées</h2>
    </hgroup>

    <p class="error-text">
      Vous vous êtes aventuré hors de la carte connue du royaume CodeQuest. 
      Cette route est introuvable ou le portail magique a expiré.
    </p>

    <footer class="error-actions">
      <a mat-flat-button class="action-button" routerLink="/worlds">
        <mat-icon>home</mat-icon>
        <span>Retourner au Tableau de Bord</span>
      </a>
    </footer>
  </article>
</main>
